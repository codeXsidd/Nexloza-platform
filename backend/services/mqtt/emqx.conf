## EMQX Broker Configuration for Nexloza
## See: https://www.emqx.io/docs/en/latest/configuration/configuration-manual.html

node {
  name = "emqx@127.0.0.1"
  cookie = "nexloza_secret_cookie"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 512000
  ssl_options {
    certfile = "/etc/emqx/certs/cert.pem"
    keyfile = "/etc/emqx/certs/key.pem"
    cacertfile = "/etc/emqx/certs/ca.pem"
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 1024000
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

authorization {
  deny_action = disconnect
  no_match = deny
  cache {
    enable = true
    max_size = 1024
    ttl = "1m"
  }
  sources = [
    {
      type = file
      enable = true
      path = "/etc/emqx/acl.conf"
    }
  ]
}
