%% Nexloza MQTT ACL Rules
%% Devices can only publish/subscribe to their own topics

%% Allow devices to publish telemetry
{allow, {username, {re, "^[0-9a-f-]+$"}}, publish, ["nexloza/+/${username}/telemetry/#"]}.

%% Allow devices to publish state
{allow, {username, {re, "^[0-9a-f-]+$"}}, publish, ["nexloza/+/${username}/state/#"]}.

%% Allow devices to publish heartbeat
{allow, {username, {re, "^[0-9a-f-]+$"}}, publish, ["nexloza/+/${username}/heartbeat"]}.

%% Allow devices to subscribe to commands
{allow, {username, {re, "^[0-9a-f-]+$"}}, subscribe, ["nexloza/+/${username}/commands/#"]}.

%% Allow devices to subscribe to OTA
{allow, {username, {re, "^[0-9a-f-]+$"}}, subscribe, ["nexloza/+/${username}/ota/#"]}.

%% Allow backend service full access
{allow, {username, "nexloza_service"}, all, ["#"]}.

%% Deny all other access
{deny, all, all, ["#"]}.
