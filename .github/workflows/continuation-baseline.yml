name: Continuation baseline

on:
  push:
    branches: [codex/continuation-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Record SDK versions and doctor output
        run: |
          mkdir -p "$RUNNER_TEMP/nexloza-baseline"
          {
            flutter --version
            dart --version
            flutter doctor -v
          } 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/toolchain.log"

      - name: Install locked dependencies
        id: dependencies
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/nexloza-baseline"
          flutter pub get --enforce-lockfile 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/dependencies.log"

      - name: Analyze
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/analyze.log"

      - name: Run Flutter tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/test.log"

      - name: Build release web app
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build web --release --no-pub 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/web.log"

      - name: Build debug APK
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/nexloza-baseline/android.log"

      - name: Upload validation logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: continuation-baseline-logs
          path: ${{ runner.temp }}/nexloza-baseline/
          if-no-files-found: ignore
