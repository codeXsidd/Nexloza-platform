[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
lib_extra_dirs = ../../nexloza-sdk
build_flags =
    -DWIFI_SSID=\"YourSSID\"
    -DWIFI_PASS=\"YourPassword\"
    -DNEXLOZA_SERVER=\"mqtt.nexloza.com\"
    -DNEXLOZA_DEVICE_ID=\"esp32-dht22-001\"
    -DNEXLOZA_API_KEY=\"YOUR_API_KEY\"
    -DNEXLOZA_API_SECRET=\"YOUR_API_SECRET\"
    -DNEXLOZA_ORG_ID=\"YOUR_ORG_ID\"
    -DNEXLOZA_PROJECT_ID=\"YOUR_PROJECT_ID\"
