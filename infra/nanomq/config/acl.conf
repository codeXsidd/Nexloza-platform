# NanoMQ ACL Rules — NEXLOZA
# Format: {allow|deny} {username|clientid|ipaddr|all} {sub|pub|pubsub} {topic}
# Rules evaluated top-to-bottom, first match wins.

# Admin can do anything
{allow, {username, "nexloza_admin"}, pubsub, "#"}

# Devices can only publish/subscribe to their own topics.
# Device usernames follow the pattern: device_{device_id}
# Topic pattern: nexloza/v1/{org_id}/{project_id}/{device_id}/{channel}
# NanoMQ ACL supports + and # wildcards.

# App clients (prefix app_) can subscribe to project-wide topics
{allow, {username, "nexloza_app"}, sub, "nexloza/v1/#"}
{allow, {username, "nexloza_app"}, pub, "nexloza/v1/+/+/+/command"}

# Deny everything else by default
{deny, all, pubsub, "#"}
