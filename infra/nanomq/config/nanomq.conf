# NanoMQ Configuration — NEXLOZA IoT Platform
# Docs: https://nanomq.io/docs/en/latest/config-description/

# MQTT TCP Listener
listeners.tcp {
    bind = "0.0.0.0:1883"
}

# MQTT TLS Listener (production)
# Uncomment and configure certificates for production use
# listeners.ssl {
#     bind = "0.0.0.0:8883"
#     keyfile = "/etc/nanomq/certs/server.key"
#     certfile = "/etc/nanomq/certs/server.crt"
#     cacertfile = "/etc/nanomq/certs/ca.crt"
# }

# MQTT WebSocket Listener
listeners.ws {
    bind = "0.0.0.0:8083"
}

# HTTP API for health checks and management
http_server {
    port = 8081
    username = admin
    password = "${NANOMQ_HTTP_PASSWORD:-nanomq_admin}"
}

# MQTT protocol settings
mqtt {
    max_packet_size = 256KB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
    property_size = 32
}

# Logging
log {
    to = [console]
    level = warn
}

# Authentication via password file
auth {
    allow_anonymous = false
    no_match = deny
    cache {
        max_size = 1024
        duration = 1m
    }
    password = {include "/etc/nanomq/pw.conf"}
    acl = {include "/etc/nanomq/acl.conf"}
}
