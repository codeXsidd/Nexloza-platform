version: "3.8"

services:
  nanomq:
    image: emqx/nanomq:0.22.6-slim
    container_name: nexloza-nanomq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NANOMQ_MQTT_PORT:-1883}:1883"
      - "${NANOMQ_WS_PORT:-8083}:8083"
      - "${NANOMQ_HTTP_PORT:-8081}:8081"
    command: ["--conf", "/run/nexloza/nanomq.conf"]
    volumes:
      - type: bind
        source: ${NEXLOZA_BROKER_CONFIG:-../../.nexloza-iot}
        target: /run/nexloza
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bash", "-c", "true </dev/tcp/127.0.0.1/1883"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexloza-net

networks:
  nexloza-net:
    driver: bridge
