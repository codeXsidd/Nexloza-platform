version: "3.8"

services:
  nanomq:
    image: emqx/nanomq:0.22.6-slim
    container_name: nexloza-nanomq
    restart: unless-stopped
    ports:
      - "${NANOMQ_MQTT_PORT:-1883}:1883"
      - "${NANOMQ_WS_PORT:-8083}:8083"
      - "${NANOMQ_HTTP_PORT:-8081}:8081"
    volumes:
      - ./config/nanomq.conf:/etc/nanomq/nanomq.conf:ro
      - ./config/pw.conf:/etc/nanomq/pw.conf:ro
      - ./config/acl.conf:/etc/nanomq/acl.conf:ro
    environment:
      NANOMQ_ADMIN_PASSWORD: ${NANOMQ_ADMIN_PASSWORD:-change_me_in_production}
      NANOMQ_APP_PASSWORD: ${NANOMQ_APP_PASSWORD:-change_me_in_production}
      NANOMQ_HTTP_PASSWORD: ${NANOMQ_HTTP_PASSWORD:-nanomq_admin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v4"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexloza-net

networks:
  nexloza-net:
    driver: bridge
