name: nexloza
description: "Nexloza — Universal IoT Platform. One app, unlimited IoT projects."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dio: ^5.7.0
  fl_chart: ^0.70.2
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  mqtt_client: ^10.6.0
  crypto: ^3.0.6
  http: ^1.3.0
  timeago: ^3.7.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
